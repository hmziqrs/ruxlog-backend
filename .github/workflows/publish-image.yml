name: publish-image

# Publish the backend API image to GitHub Container Registry (GHCR) on version
# tags and on manual dispatch. The VPS pulls and rolls out updates itself via
# Watchtower (see backend/api/docs/WATCHTOWER_SETUP.md), so this workflow only
# builds and pushes — it does no SSH and triggers no deploy webhook.
#
# This supersedes the misplaced backend/api/.github/workflows/cicd.yml, whose
# `context: .` + `file: Dockerfile` ran relative to backend/api/ and so never
# matched the real Dockerfile at backend/docker/Dockerfile.api. That workflow
# file has been removed; this is the canonical publish pipeline.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag to build (e.g., v1.2.3)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  # owner/repo — the GHCR package namespace.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      raw: ${{ steps.vars.outputs.raw }}
      is_stable: ${{ steps.vars.outputs.is_stable }}
      image_ref: ${{ steps.image.outputs.ref }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version/tag
        id: vars
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          # Prefer an explicit workflow_dispatch input, otherwise the pushed tag.
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME:-}}"
          if [ -z "$VERSION" ]; then
            echo "No version provided and not running from a tag push" >&2
            exit 1
          fi
          # Support tags like v1.2.3 (strip a single leading 'v').
          RAW="${VERSION#v}"
          if [[ "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_STABLE=1
          else
            IS_STABLE=0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "is_stable=$IS_STABLE" >> "$GITHUB_OUTPUT"

      - name: Compose tag list
        id: tags
        run: |
          set -euo pipefail
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}"
          TAGS="$TAGS"$'\n'"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.raw }}"
          # `latest` follows stable x.y.z releases only; pre-release tags
          # (e.g. v1.2.3-rc.1) still publish their explicit tags above.
          if [ "${{ steps.vars.outputs.is_stable }}" = "1" ]; then
            TAGS="$TAGS"$'\n'"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
          {
            echo 'tags<<EOF'
            echo "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # NOTE: build args are intentionally NOT passed. The feature set is decided
      # by backend/docker/Dockerfile.api (currently a default-feature release
      # build). To ship `--features full`, change the Dockerfile's cargo build
      # line — do not bake features into the publish pipeline.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Build context is the backend/ workspace; the Dockerfile COPYs
          # api/Cargo.toml, api/src, api/crates/... relative to ./backend.
          context: ./backend
          file: backend/docker/Dockerfile.api
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Expose image reference
        id: image
        run: |
          echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}" >> "$GITHUB_OUTPUT"

  # Deployment is handled by Watchtower polling on the VPS — no webhook/SSH.
