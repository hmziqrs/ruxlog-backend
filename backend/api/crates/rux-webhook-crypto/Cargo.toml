[package]
name = "rux-webhook-crypto"
version = "0.1.0"
edition = "2021"
description = "Provider-agnostic webhook signature verification (HMAC-SHA256, Ed25519, Standard Webhooks) with replay-window protection"
publish = false

[dependencies]
http = "1.0"
base64 = "0.22.1"
hmac = "0.12.1"
sha2 = "0.10.8"
hex = "0.4.3"
subtle = "2.6.1"
ed25519-dalek = { version = "2.1.1", default-features = false }
