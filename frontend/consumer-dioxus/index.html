<!doctype html>
<html lang="en" class="dark h-full">
    <head>
        <title>{app_title}</title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta charset="UTF-8" />
        <!--
            M-8: Content-Security-Policy. This WASM SPA renders server-supplied
            post HTML via dangerous_inner_html (client-side ammonia sanitizes it
            — see src/utils/editorjs), so script-src must NOT grant
            'unsafe-inline': that would re-enable every injected inline script /
            event-handler / javascript: URI and defeat the stored-XSS
            defence-in-depth even if ammonia were bypassed.

            TWO serving modes, one policy shape:

            1. SSR (server feature — the normal launch, see main.rs): Dioxus
               fullstack injects a DYNAMIC per-render hydration script
               (window.initial_dioxus_hydration_data=…) that no static CSP can
               authorize (it is un-hashable, and 'unsafe-inline' is rejected
               above). The csp_nonce tower layer (src/csp_nonce.rs) therefore
               STRIPS this meta tag from the served document and emits a
               per-response header instead:
                 script-src 'self' 'nonce-<random>' 'wasm-unsafe-eval' 'unsafe-eval'
               stamping only the Dioxus hydration scripts with that nonce.

            2. Client-only (web feature, no SSR): no hydration script is
               injected, so this meta is the authoritative policy. The only
               inline script is the fallback shim below, authorized by its
               static hash. 'wasm-unsafe-eval' + 'unsafe-eval' are required for
               WebAssembly compilation + dioxus-web's document::eval; neither
               weakens the stored-XSS control (they gate eval/WASM only from an
               already-running JS context, which 'self' withholds from injected
               HTML).

            style-src allows the inline styles + Google Fonts the app injects;
            img-src 'self' data: https: covers avatar/media/object-storage URLs.
            frame-ancestors 'none' is ALSO emitted as a real HTTP header by the
            nonce layer (browsers ignore frame-ancestors delivered via meta).
        -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'sha256-jr/9KV8H3BuJeFDMuAzCJk3E79gtzzEmseRYuWkVirQ=' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
        />

    </head>
    <body class="antialiased min-h-full flex flex-col">
        <div id="main"></div>
        <script>
            // Some static builds ship a shell index without SSR hydration bytes.
            // Dioxus web runtime decodes this value as CBOR-serialized Vec<Option<Vec<u8>>>,
            // so provide a valid empty payload instead of an empty string.
            window.initial_dioxus_hydration_data =
                window.initial_dioxus_hydration_data || "gA==";
        </script>
    </body>
</html>
